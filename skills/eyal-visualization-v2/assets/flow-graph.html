<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flow graph - where units go</title>
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans/400.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans/500.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans/600.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans/700.css" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      /* Axiforma has no public CDN -- it is picked up only if locally installed,
         DM Sans is what actually ships. Never <link> Axiforma. */
      --font: "Axiforma", "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --text-xs: 12px;
      --text-sm: 13px;
      --text-base: 14px;
      --text-body: 16px;
      --text-h2: 20px;
      --canvas: #F5F5F7;
      --canvas-deep: #EBEBEF;
      --ink: #1D1D1F;
      --ink-soft: #6E6E73;
      --surface: #FFFFFF;
      --surface-raised: #FFFFFF;
      --accent: #2563EB;
      --accent-2: #6366F1;
      --success: #69c440;
      --warning: #ff9323;
      --warning-ink: #B85E00;
      --warning-soft: rgba(255, 147, 35, 0.14);
      --danger: #da0808;
      /* Flow tones. One tone per destination meaning, never per node. */
      --flow-neutral: #98989D;
      --flow-accent: var(--accent);
      --flow-accent-2: var(--accent-2);
      --flow-teal: #2F9E90;
      --flow-violet: #8B5CF6;
      --flow-good: var(--success);
      --flow-warning: var(--warning);
      --flow-danger: var(--danger);
      --border: rgba(0, 0, 0, 0.07);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 24px rgba(0, 0, 0, 0.06);
      --radius: 16px;
      --radius-lg: 24px;
      --radius-pill: 9999px;
    }
    body.dark {
      --canvas: #0F1117;
      --canvas-deep: #161922;
      --ink: #F5F5F7;
      --ink-soft: #98989D;
      --surface: #1C1F28;
      --surface-raised: #252932;
      --accent: #3B82F6;
      --accent-2: #818CF8;
      --warning-ink: #FFB066;
      --danger: #f04444;
      --flow-neutral: #6B6F7A;
      --flow-teal: #4FC1B2;
      --flow-violet: #A78BFA;
      --border: rgba(255, 255, 255, 0.08);
      --shadow-md: 0 4px 32px rgba(0, 0, 0, 0.4);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { font-family: var(--font); }
    body { font-size: var(--text-body); background: var(--canvas); color: var(--ink); min-height: 100vh; }
    button, input, select, textarea { font-family: inherit; }
    code, pre { font-family: var(--font-mono); }
    code { font-size: 0.92em; padding: 1px 6px; border-radius: 5px; background: var(--canvas-deep); }
    svg text { font-family: var(--font); }

    .page-canvas {
      position: fixed; inset: 0; overflow: hidden; pointer-events: none;
      background:
        radial-gradient(ellipse 54% 42% at 12% 8%, rgba(37, 99, 235, 0.11), transparent 64%),
        radial-gradient(ellipse 48% 40% at 88% 94%, rgba(99, 102, 241, 0.1), transparent 62%),
        var(--canvas);
      animation: canvasEaseIn 500ms ease both;
    }
    body.dark .page-canvas { background: #030303; }
    .shell { position: relative; z-index: 1; width: min(1360px, calc(100% - 48px)); margin: 0 auto; padding: 28px 0 32px; }
    .page-chrome { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    .theme-button {
      min-height: 40px; padding: 0 14px; border: 0; border-radius: var(--radius-pill);
      background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; font-size: var(--text-sm); font-weight: 600;
      transition: transform 100ms ease, background 100ms ease;
    }
    .theme-button:hover { background: var(--surface-raised); }
    .theme-button:active { transform: scale(0.98); }

    .card { padding: 24px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-md); animation: rise 300ms ease both; }
    .card-header-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }
    .card-header-row h2 { font-size: var(--text-h2); letter-spacing: -0.02em; line-height: 1.2; }
    .card-sub { margin-top: 4px; color: var(--ink-soft); font-size: var(--text-base); }
    .flow-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .flow-legend span { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); font-weight: 600; color: var(--ink-soft); }
    .flow-legend i.sw { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
    .example-chip { padding: 4px 10px; border-radius: var(--radius-pill); background: var(--warning-soft); color: var(--warning-ink) !important; font-weight: 700 !important; }

    .info-wrap { position: relative; display: inline-flex; vertical-align: middle; margin-left: 4px; }
    .info-btn { width: 22px; height: 22px; border: 0; border-radius: 50%; background: var(--canvas); color: var(--ink-soft); cursor: pointer; font-size: var(--text-xs); font-weight: 700; }
    .info-btn:hover { background: var(--canvas-deep); color: var(--ink); }
    .info-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .elab-panel { display: none; position: absolute; z-index: 20; top: 100%; left: 0; margin-top: 6px; padding: 12px 14px; min-width: 260px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-md); font-size: var(--text-xs); line-height: 1.5; color: var(--ink); }
    .info-wrap:hover .elab-panel, .info-wrap:focus-within .elab-panel { display: block; }

    .flow-focus { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; padding: 4px 4px 4px 12px; border-radius: var(--radius-pill); background: rgba(37, 99, 235, 0.1); font-size: var(--text-sm); font-weight: 500; }
    .flow-focus[hidden] { display: none; }
    .chip-reset { min-height: 28px; padding: 0 12px; border: 0; border-radius: var(--radius-pill); background: var(--surface); color: var(--accent); font-size: var(--text-sm); font-weight: 600; cursor: pointer; transition: background 100ms ease, transform 100ms ease; }
    .chip-reset:hover { background: var(--surface-raised); }
    .chip-reset:active { transform: scale(0.98); }
    .chip-reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .chip-reset:disabled { color: var(--ink-soft); opacity: 0.6; cursor: not-allowed; }
    .flow-status { min-height: 20px; margin-top: 8px; font-size: var(--text-sm); color: var(--ink-soft); }

    .flow-scroll { overflow-x: auto; padding-bottom: 4px; }
    .flow-host { min-width: 900px; }
    .flow-svg { width: 100%; height: auto; display: block; -webkit-user-select: none; user-select: none; }
    .flow-ribbon { opacity: 0.24; transition: opacity 100ms ease; }
    .flow-ribbon:hover { opacity: 0.45; }
    .flow-svg.has-pin .flow-ribbon { opacity: 0.08; }
    .flow-svg.has-pin .flow-ribbon.on { opacity: 0.45; }
    .flow-svg.has-pin .flow-node-g:not(.on) { opacity: 0.35; }
    .flow-node { rx: 3; }
    .flow-node-g { outline: none; cursor: pointer; transition: opacity 100ms ease; }
    .flow-node-g:focus-visible .flow-node { stroke: var(--ink); stroke-width: 2; }
    .flow-hit { fill: transparent; stroke: none; pointer-events: all; }
    .flow-ribbon.is-branch { cursor: pointer; }
    .flow-col-head { font-size: 12px; font-weight: 700; fill: var(--ink-soft); letter-spacing: 0.04em; text-transform: uppercase; }
    .flow-label, .flow-note { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
    .flow-label { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .flow-value { font-weight: 700; }
    .flow-note { font-size: 12px; font-weight: 500; fill: var(--ink-soft); }

    .tone-neutral { fill: var(--flow-neutral); background: var(--flow-neutral); }
    .tone-accent { fill: var(--flow-accent); background: var(--flow-accent); }
    .tone-accent-2 { fill: var(--flow-accent-2); background: var(--flow-accent-2); }
    .tone-teal { fill: var(--flow-teal); background: var(--flow-teal); }
    .tone-violet { fill: var(--flow-violet); background: var(--flow-violet); }
    .tone-good { fill: var(--flow-good); background: var(--flow-good); }
    .tone-warning { fill: var(--flow-warning); background: var(--flow-warning); }
    .tone-danger { fill: var(--flow-danger); background: var(--flow-danger); }

    .insight { list-style: none; margin-top: 16px; padding: 14px 16px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); display: grid; gap: 6px; }
    .insight li { font-size: var(--text-base); color: var(--ink-soft); line-height: 1.4; display: flex; gap: 8px; }
    .insight li i { margin-top: 2px; color: var(--accent); }
    .footer { margin-top: 20px; font-size: var(--text-xs); color: var(--ink-soft); }

    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes canvasEaseIn { from { opacity: 0; } to { opacity: 1; } }
    @media (max-width: 720px) {
      .shell { width: calc(100% - 24px); }
      .card { padding: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="page-canvas" aria-hidden="true"></div>
  <main class="shell">
    <div class="page-chrome">
      <button class="theme-button" id="themeBtn" type="button" aria-label="Switch to dark theme">
        <i class="ph ph-moon" id="themeIcon"></i>
        <span id="themeLabel">Dark</span>
      </button>
    </div>

    <section class="card">
      <div class="card-header-row">
        <div>
          <h2 id="flowTitle"></h2>
          <p class="card-sub"><span id="flowSub"></span><span class="info-wrap"><button type="button" class="info-btn" aria-label="How to read this graph">i</button><span class="elab-panel" id="flowInfo"></span></span></p>
        </div>
        <div class="flow-legend" id="flowLegend"></div>
      </div>
      <div class="flow-focus" id="flowFocus" hidden><span id="flowFocusText"></span><button class="chip-reset" id="flowShowAll" type="button">Show all</button></div>
      <div class="flow-scroll">
        <div class="flow-host" id="flowHost"></div>
      </div>
      <div class="flow-status" id="flowStatus" aria-live="polite"></div>
      <ul class="insight">
        <li><i class="ph ph-check"></i><span>Proof rows never reach scale, so accuracy comes from rows the spec never saw.</span></li>
        <li><i class="ph ph-check"></i><span>Coverage is the share Jev keeps; the fallback vote labels the rest.</span></li>
      </ul>
    </section>
    <div class="footer" id="footer"></div>
  </main>

  <script>
    function fmtNum(val) {
      if (val == null || isNaN(val)) return "-";
      const n = Number(val);
      const sign = n < 0 ? "-" : "";
      const abs = Math.abs(n);
      if (Math.round(abs) < 1000) return sign + String(Math.round(abs));
      const k = abs / 1e3;
      const two = k.toFixed(2);
      if (parseFloat(two) < 1000) return sign + (two.endsWith("0") ? k.toFixed(1) : two) + "K";
      return sign + (abs / 1e6).toFixed(2) + "M";
    }
    function fmtInt(val) {
      if (val == null || isNaN(val)) return "-";
      const s = String(Math.round(Math.abs(val)));
      let out = "";
      for (let i = 0; i < s.length; i++) {
        if (i > 0 && (s.length - i) % 3 === 0) out += ",";
        out += s[i];
      }
      return (val < 0 ? "-" : "") + out;
    }
    function fmtPct(val, decimals) {
      if (val == null || isNaN(val)) return "-";
      const d = decimals == null ? 1 : decimals;
      return Number(val).toFixed(d) + "%";
    }
    function fmtDate(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return "-";
      const m = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][d.getUTCMonth()];
      return m + " " + d.getUTCDate() + ", " + d.getUTCFullYear();
    }

    // Worked example: jev-classify "Where rows go" (Oct 2026). Set sizes are real skill
    // defaults; the scale split is illustrative, so `example: true` shows the chip.
    const FLOW = {
      generated_at: "2026-10-08T08:00:00Z",
      title: "Where rows go",
      subtitle: "Which rows prove quality, and which ones get labeled.",
      example: true,
      unit: "rows",
      columns: ["All rows", "Disjoint sets", "Scale routing", "Fallback result"],
      legend: [
        { tone: "accent-2", label: "Label discovery" },
        { tone: "teal", label: "Proof rows" },
        { tone: "accent", label: "Jev" },
        { tone: "violet", label: "Fallback vote" },
        { tone: "warning", label: "Unresolved" }
      ],
      nodes: [
        { key: "all", col: 0, label: "All rows", tone: "neutral" },
        { key: "taxonomy", col: 1, parent: "all", label: "Taxonomy sample", note: "Strong LLM drafts labels, you approve", value: 1000, tone: "accent-2" },
        { key: "smoke", col: 1, parent: "all", label: "Smoke", note: "Checks the spec and the cost", value: 5, tone: "neutral" },
        { key: "work", col: 1, parent: "all", label: "Work", note: "Improve loop, sealed comparison half", value: 400, tone: "teal" },
        { key: "valid", col: 1, parent: "all", label: "Validation", note: "Accuracy and threshold, never tuned on", value: 1000, tone: "teal" },
        { key: "scale", col: 1, parent: "all", label: "Scale", note: "Scored by Jev after your yes", value: 10000, tone: "accent" },
        { key: "keep", col: 2, parent: "scale", label: "Jev keeps its label", shareNote: "coverage at the threshold", value: 7800, tone: "accent" },
        { key: "fallback", col: 2, parent: "scale", label: "Fallback vote", shareNote: "below or without a threshold", value: 2200, tone: "violet" },
        { key: "agree", col: 3, parent: "fallback", label: "2 of 3 agree", note: "Vote label is used", value: 1900, tone: "violet" },
        { key: "unresolved", col: 3, parent: "fallback", label: "Unresolved", note: "Unclear or human queue", value: 300, tone: "warning" }
      ]
    };

    const FLOW_LAYOUT = { width: 1240, top: 44, nodeW: 14, gap: 34, minH: 4, heightBudget: 496, lastColRoom: 280, left: 24 };
    const FLOW_CAPS = { columns: 4, nodesPerCol: 6, labelWords: 4, noteWords: 8 };
    const SVG_NS = "http://www.w3.org/2000/svg";

    function words(s) { return String(s || "").trim().split(/\s+/).filter(Boolean).length; }

    // Builds the tree, fills missing parent values, tags each node with its level-1 branch,
    // and warns on every rule the recipe sets (`quiet` for the focused copy of a checked flow).
    function buildFlow(flow, quiet) {
      const warn = quiet ? () => {} : (m) => console.warn("[flow] " + m);
      const byKey = {};
      flow.nodes.forEach((n, i) => { byKey[n.key] = { ...n, order: i, children: [] }; });
      const nodes = flow.nodes.map((n) => byKey[n.key]);
      const roots = nodes.filter((n) => !n.parent);
      if (roots.length !== 1) warn("needs exactly one root, found " + roots.length);
      nodes.forEach((n) => {
        if (!n.parent) return;
        const p = byKey[n.parent];
        if (!p) { warn("missing parent " + n.parent + " for " + n.key); return; }
        if (p.col !== n.col - 1) warn(n.key + " must sit one column right of its parent");
        p.children.push(n);
      });
      const fill = (n) => {
        n.children.forEach(fill);
        const sum = n.children.reduce((s, c) => s + c.value, 0);
        if (n.value == null) n.value = sum;
        else if (n.children.length && Math.abs(sum - n.value) > 0.5) warn("children of " + n.key + " sum to " + sum + ", not " + n.value + " - add an Other node");
      };
      roots.forEach(fill);
      // A branch is a level-1 node with children; it and everything under it share its key.
      const tag = (n, b) => { n.branch = b; n.children.forEach((c) => tag(c, b)); };
      roots.forEach((r) => r.children.forEach((c) => tag(c, c.children.length ? c.key : null)));
      const cols = [];
      nodes.forEach((n) => { (cols[n.col] = cols[n.col] || []).push(n); });
      if (cols.length > FLOW_CAPS.columns) warn("more than " + FLOW_CAPS.columns + " columns");
      cols.forEach((c, i) => { if (c.length > FLOW_CAPS.nodesPerCol) warn("column " + i + " has " + c.length + " nodes"); });
      nodes.forEach((n) => {
        if (words(n.label) > FLOW_CAPS.labelWords) warn("label over " + FLOW_CAPS.labelWords + " words: " + n.label);
        if (words(n.note || n.shareNote) > FLOW_CAPS.noteWords) warn("note over " + FLOW_CAPS.noteWords + " words: " + n.key);
      });
      return { root: roots[0], cols, byKey };
    }

    // Focused copy: the root plus one branch subtree. The root re-sums to the branch, so the
    // branch fills the full height and its children read as a full-size distribution.
    function focusFlow(flow, full, key) {
      const keep = new Set();
      const walk = (n) => { keep.add(n.key); n.children.forEach(walk); };
      walk(full.byKey[key]);
      return { ...flow, nodes: flow.nodes.filter((n) => !n.parent || keep.has(n.key)).map((n) => (n.parent ? n : { ...n, value: undefined })) };
    }

    function layoutFlow(tree, L, colCount) {
      const { root, cols } = tree;
      const sized = cols.slice(1);
      const maxTotal = Math.max(...sized.map((c) => c.reduce((s, n) => s + n.value, 0)));
      const maxCount = Math.max(...sized.map((c) => c.length));
      const unit = (L.heightBudget - L.gap * (maxCount - 1)) / maxTotal;
      // Column x comes from the full flow, so focusing never slides the columns sideways.
      const step = (L.width - L.left - L.lastColRoom) / Math.max(1, colCount - 1);
      cols.forEach((c, i) => c.forEach((n) => { n.x = L.left + i * step; n.h = Math.max(L.minH, n.value * unit); }));

      const assignSlots = (n) => {
        let off = n.y;
        n.children.forEach((c) => { c.slotY = off; off += c.h; });
      };
      for (let i = 1; i < cols.length; i++) {
        let prevBottom = -Infinity;
        cols[i].forEach((n) => {
          const desired = i === 1 ? L.top : n.slotY;
          n.y = Math.max(desired, prevBottom + L.gap);
          prevBottom = n.y + n.h;
        });
        if (i === 1) {
          const first = cols[1][0], last = cols[1][cols[1].length - 1];
          root.h = cols[1].reduce((s, n) => s + n.h, 0);
          root.y = (first.y + last.y + last.h) / 2 - root.h / 2;
          assignSlots(root);
        }
        cols[i].forEach(assignSlots);
      }
      let bottom = 0;
      cols.forEach((c) => c.forEach((n) => { bottom = Math.max(bottom, n.y + n.h, n.y + n.h / 2 + 20); }));
      return { height: Math.ceil(bottom + 28) };
    }

    // A non-zero share never reads as 0.0%.
    function fmtRate(r) { return r > 0 && r < 0.1 ? "<0.1%" : fmtPct(r); }

    function svgEl(tag, attrs, text) {
      const el = document.createElementNS(SVG_NS, tag);
      Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
      if (text != null) el.textContent = text;
      return el;
    }
    function ribbonPath(x0, y0, x1, y1, h) {
      const mx = (x0 + x1) / 2;
      return `M${x0},${y0} C${mx},${y0} ${mx},${y1} ${x1},${y1} L${x1},${y1 + h} C${mx},${y1 + h} ${mx},${y0 + h} ${x0},${y0 + h} Z`;
    }

    // Per-host view state. Focus and pin survive a FLOW swap (filter / population) while
    // their keys still exist in the new flow.
    function flowState(host) {
      if (host._flow) return host._flow;
      const S = (host._flow = { flow: null, opts: null, focus: null, pin: null, focusAt: 0 });
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape" || !host.getClientRects().length) return;
        if (S.pin) setPin(host, null);
        else if (S.focus) setFocus(host, null, host.contains(document.activeElement));
      });
      return S;
    }

    // Default: label = share of the current whole (root, or the focused branch); the root
    // shows its total, or the focused branch's share of the whole. `base: "parent"` = share of parent.
    function renderFlow(flow, host, opts) {
      const L = FLOW_LAYOUT;
      const S = flowState(host);
      if (opts || !S.opts) S.opts = { focus: true, onChange: null, ...opts };
      S.flow = flow;
      const full = buildFlow(flow);
      const branch = S.opts.focus && S.focus ? full.byKey[S.focus] : null;
      if (!branch || !branch.branch) S.focus = null;
      const tree = S.focus ? buildFlow(focusFlow(flow, full, S.focus), true) : full;
      if (S.pin && !tree.byKey[S.pin]) S.pin = null;
      const { height } = layoutFlow(tree, L, full.cols.length);
      const focusNode = S.focus ? full.byKey[S.focus] : null;
      const baseNode = focusNode ? tree.byKey[S.focus] : tree.root;
      const whole = full.root;
      const hint = S.opts.focus ? (focusNode ? " Double-click or press Escape to show all." : " Click a branch to see only it.") : "";
      const svg = svgEl("svg", { class: "flow-svg", viewBox: `0 0 ${L.width} ${height}`, role: "group", "aria-label": flow.title + ": " + flow.subtitle + hint });
      tree.cols.forEach((c, i) => svg.appendChild(svgEl("text", { x: c[0].x, y: 18, class: "flow-col-head" }, flow.columns[i])));
      const ribbons = svgEl("g", {});
      const nodesG = svgEl("g", {});
      svg.append(ribbons, nodesG);

      tree.cols.forEach((col) => col.forEach((n) => {
        const isRoot = n === tree.root;
        const fp = n.parent ? full.byKey[n.parent] : null;
        const b = isRoot ? null : flow.base === "parent" && n.parent !== tree.root.key ? tree.byKey[n.parent] : baseNode;
        const rate = isRoot ? (focusNode ? (focusNode.value / whole.value) * 100 : null) : (n.value / b.value) * 100;
        const shareP = fp ? (n.value / fp.value) * 100 : null;
        let tip;
        if (isRoot) tip = focusNode ? `${focusNode.label}: ${fmtInt(focusNode.value)} (${fmtRate(rate)} of ${whole.label})` : `${n.label}: ${fmtInt(n.value)}`;
        else {
          const parts = [];
          if (b !== n) parts.push(`${fmtRate(rate)} of ${b.label}`);
          if (fp && fp.key !== b.key) parts.push(`${fmtRate(shareP)} of ${fp.label}`);
          tip = `${n.label}: ${fmtInt(n.value)}` + (parts.length ? ` (${parts.join(", ")})` : "");
        }
        const canFocus = S.opts.focus && !focusNode && !!n.branch;
        if (!isRoot) {
          const parent = tree.byKey[n.parent];
          const r = svgEl("path", { d: ribbonPath(parent.x + L.nodeW, n.slotY, n.x, n.y, n.h), class: "flow-ribbon tone-" + n.tone + (canFocus ? " is-branch" : ""), "data-key": n.key });
          r.appendChild(svgEl("title", {}, tip));
          ribbons.appendChild(r);
        }
        const action = canFocus ? "Press Enter to see only this branch." : focusNode && n.key === S.focus ? "Press Escape to show all." : "Press Enter to pin.";
        const g = svgEl("g", { class: "flow-node-g", "data-key": n.key, tabindex: 0, role: "button", "aria-label": tip + ". " + action });
        g.appendChild(svgEl("title", {}, tip));
        const shareNote = n.shareNote && (fp && b && fp.key === b.key ? n.shareNote : fmtRate(shareP) + " " + n.shareNote);
        const note = isRoot && focusNode ? "in " + focusNode.label : shareNote || n.note;
        const lx = n.x + L.nodeW + 10;
        const cy = isRoot && !focusNode ? n.y - 18 : n.y + n.h / 2;
        if (n.col === 1) {
          g.appendChild(svgEl("rect", { class: "flow-hit", x: n.x - 4, y: n.y - 4, width: L.nodeW + 8, height: n.h + 8 }));
          g.appendChild(svgEl("rect", { class: "flow-hit flow-hit-label", x: lx - 4, y: cy - 18, width: 0, height: 38 }));
        }
        g.appendChild(svgEl("rect", { x: n.x, y: n.y, width: L.nodeW, height: n.h, class: "flow-node tone-" + n.tone }));
        const t = svgEl("text", { x: lx, y: note ? cy - 3 : cy + 5, class: "flow-label" });
        t.append(svgEl("tspan", {}, n.label + " "), svgEl("tspan", { class: "flow-value" }, rate == null ? fmtNum(n.value) : fmtRate(rate)));
        g.appendChild(t);
        if (note) g.appendChild(svgEl("text", { x: lx, y: cy + 14, class: "flow-note" }, note));
        nodesG.appendChild(g);
      }));

      const keyOf = (ev) => { const el = ev.target.closest("[data-key]"); return el ? el.getAttribute("data-key") : null; };
      const act = (key, fromKey) => {
        const n = tree.byKey[key];
        if (S.opts.focus && !S.focus && n.branch) return setFocus(host, n.branch, fromKey);
        if (key === S.focus) return;
        setPin(host, S.pin === key ? null : key);
      };
      svg.addEventListener("click", (ev) => {
        if (ev.detail > 1) return;
        const key = keyOf(ev);
        if (key) act(key, false);
        else if (S.pin) setPin(host, null);
      });
      svg.addEventListener("dblclick", (ev) => {
        if (!S.focus || performance.now() - S.focusAt < 500) return;
        ev.preventDefault();
        setFocus(host, null, false);
      });
      svg.addEventListener("keydown", (ev) => {
        if (ev.key !== "Enter" && ev.key !== " ") return;
        const key = keyOf(ev);
        if (!key) return;
        ev.preventDefault();
        act(key, true);
      });
      host.replaceChildren(svg);
      // Level-1 hit rects: node + 4px each side, and the label block, so a band under either never eats the click.
      svg.querySelectorAll(".flow-hit-label").forEach((hit) => {
        let w = 0;
        hit.parentNode.querySelectorAll("text").forEach((t) => { w = Math.max(w, t.getComputedTextLength() || t.textContent.length * 7.5); });
        hit.setAttribute("width", w + 8);
      });
      S.view = { tree, full, focus: focusNode, base: focusNode || whole };
      applyPin(host);
    }

    function setFocus(host, key, fromKey) {
      const S = flowState(host);
      if (S.focus === key) return;
      const prev = S.focus;
      S.focus = key;
      S.pin = null;
      S.focusAt = performance.now();
      renderFlow(S.flow, host);
      const el = fromKey && host.querySelector(`.flow-node-g[data-key="${CSS.escape(key || prev)}"]`);
      if (el) el.focus();
    }

    function setPin(host, key) {
      const S = flowState(host);
      if (S.pin === key) return;
      S.pin = key;
      applyPin(host);
    }

    function applyPin(host) {
      const S = flowState(host);
      const svg = host.querySelector(".flow-svg");
      const on = new Set();
      if (S.pin) {
        const byKey = S.view.tree.byKey;
        for (let n = byKey[S.pin]; n; n = byKey[n.parent]) on.add(n.key);
        const down = (n) => { on.add(n.key); n.children.forEach(down); };
        down(byKey[S.pin]);
      }
      svg.classList.toggle("has-pin", !!S.pin);
      svg.querySelectorAll("[data-key]").forEach((el) => el.classList.toggle("on", on.has(el.getAttribute("data-key"))));
      if (S.opts.onChange) S.opts.onChange({ focus: S.view.focus, pin: S.pin ? S.view.tree.byKey[S.pin] : null, base: S.view.base, enabled: S.opts.focus });
    }

    function renderChrome(flow) {
      document.getElementById("flowTitle").textContent = flow.title;
      document.getElementById("flowSub").textContent = flow.subtitle;
      const legend = document.getElementById("flowLegend");
      legend.replaceChildren();
      if (flow.example) {
        const chip = document.createElement("span");
        chip.className = "example-chip";
        chip.innerHTML = '<i class="ph ph-info"></i> Example split';
        legend.appendChild(chip);
      }
      flow.legend.forEach((item) => {
        const s = document.createElement("span");
        s.innerHTML = `<i class="sw tone-${item.tone}"></i>`;
        s.append(item.label);
        legend.appendChild(s);
      });
      document.getElementById("footer").textContent = "Generated " + fmtDate(flow.generated_at);
    }

    // Title, focus chip, status line, and info hover follow the engine's view.
    function syncFlowUi(v) {
      const root = FLOW.nodes.find((n) => !n.parent).label.toLowerCase();
      document.getElementById("flowTitle").textContent = v.focus ? v.focus.label + ": " + FLOW.title : FLOW.title;
      document.getElementById("flowFocus").hidden = !v.focus;
      if (v.focus) document.getElementById("flowFocusText").textContent = "Showing " + v.focus.label + " only - double-click the chart or press Esc to show all";
      const status = v.pin ? "Pinned: " + v.pin.label + ". Press Esc to clear."
        : v.focus ? "Showing " + v.focus.label + " only: " + fmtInt(v.focus.value) + " " + FLOW.unit + ". Press Esc to show all."
        : v.enabled ? "Click a branch to see only it." : "";
      document.getElementById("flowStatus").textContent = status;
      document.getElementById("flowInfo").textContent = v.focus
        ? "Labels show the share of " + v.focus.label + "; the first column shows its share of " + root + ". Hover a node or band for counts."
        : "Labels show the share of " + root + ". Hover a node or band for counts.";
    }

    function setTheme(dark) {
      if (document.body.classList.contains("dark") === dark) return;
      document.body.classList.toggle("dark", dark);
      document.getElementById("themeLabel").textContent = dark ? "Light" : "Dark";
      document.getElementById("themeIcon").className = dark ? "ph ph-sun" : "ph ph-moon";
      document.getElementById("themeBtn").setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
    }
    document.getElementById("themeBtn").addEventListener("click", () => setTheme(!document.body.classList.contains("dark")));

    const flowHost = document.getElementById("flowHost");
    document.getElementById("flowShowAll").addEventListener("click", (ev) => setFocus(flowHost, null, ev.detail === 0));
    renderChrome(FLOW);
    renderFlow(FLOW, flowHost, { focus: true, onChange: syncFlowUi });
  </script>
</body>
</html>
